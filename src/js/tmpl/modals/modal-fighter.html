<div class="grid-x fighter-details">
	<div class="cell small-6">
		<input type="text" name="fighter_name" id="fighter_name" class="form-control form-control-sm" placeholder="Fighter Name" aria-label="Fighter Name" value="{{model.fighter_name}}">
	</div>
	<div class="cell small-6">
		<input type="text" name="base_cost" id="base_cost" class="form-control form-control-sm" placeholder="Cost" aria-label="Base Cost" value="{{model.base_value}}">
	</div>
	<div class="cell small-12">
		<select name="heirarchy_role" id="heirarchy_role" class="form-select form-select-sm" aria-label="Role">
			<option value="">Role</option>
			{{#each roles}}
				{{#form-option}}{{/form-option}}
			{{/each}}
		</select>
	</div>
	<div class="cell small-12 grid-x">
		<table class="table fighter-weapon">
			<thead>
				<th colspan="1">M</th>
				<th colspan="1">WS</th>
				<th colspan="1">BS</th>
				<th colspan="1">S</th>
				<th colspan="1">T</th>
				<th colspan="1">W</th>
				<th colspan="1">I</th>
				<th colspan="1">A</th>
				<th colspan="1">LD</th>
				<th colspan="1">CL</th>
				<th colspan="1">WIL</th>
				<th colspan="1">INT</th>
				<th colspan="1">XP</th>
			</thead>
			<tbody>
				<tr>
					<td>
						<input type="text" name="movement" class="form-control form-control-sm" placeholder="M" aria-label="Movement" value="{{model.movement}}">
					</td>
					<td>
						<input type="text" name="weapon_skill" class="form-control form-control-sm" placeholder="WS" aria-label="Weapon Skill" value="{{model.weapon_skill}}">
					</td>
					<td>
						<input type="text" name="ballistic_skill" class="form-control form-control-sm" placeholder="BS" aria-label="Ballistic Skill" value="{{model.ballistic_skill}}">
					</td>
					<td>
						<input type="text" name="strength" class="form-control form-control-sm" placeholder="S" aria-label="Strength" value="{{model.strength}}">
					</td>
					<td>
						<input type="text" name="toughness" class="form-control form-control-sm" placeholder="T" aria-label="Toughness" value="{{model.toughness}}">
					</td>
					<td>
						<input type="text" name="wounds" class="form-control form-control-sm" placeholder="W" aria-label="Wounds" value="{{model.wounds}}">
					</td>
					<td>
						<input type="text" name="initiative" class="form-control form-control-sm" placeholder="I" aria-label="Inititive" value="{{model.initiative}}">
					</td>
					<td>
						<input type="text" name="attacks" class="form-control form-control-sm" placeholder="A" aria-label="Attacks" value="{{model.attacks}}">
					</td>
					<td class="head_stat">
						<input type="text" name="leadership" class="form-control form-control-sm" placeholder="LD" aria-label="Leadership" value="{{model.leadership}}">
					</td>
					<td class="head_stat">
						<input type="text" name="cool" class="form-control form-control-sm" placeholder="CL" aria-label="Cool" value="{{model.cool}}">
					</td>
					<td class="head_stat">
						<input type="text" name="willpower" class="form-control form-control-sm" placeholder="WIL" aria-label="Willpower" value="{{model.willpower}}">
					</td>
					<td class="head_stat">
						<input type="text" name="intelligence" class="form-control form-control-sm" placeholder="INT" aria-label="Intelligence" value="{{model.intelligence}}">
					</td>
					<td class="xp_stat">
						<input type="text" name="xp" class="form-control form-control-sm" placeholder="XP" aria-label="Experience" value="{{model.experience}}">
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<div class="cell small-12">
		<table class="table fighter-weapon">
			<thead>
				<th colspan="3">Weapon</th>
				<th colspan="1">Profile</th>
				<th colspan="2">Rng</th>
				<th colspan="2">Acc</th>
				<th colspan="1">Str</th>
				<th colspan="1">Ap</th>
				<th colspan="1">D</th>
				<th colspan="1">Am</th>
				<th colspan="3">Traits</th>
			</thead>
			<tbody>
				<tr>
					<td colspan="3">
						<input type="text" name="weapon_name" class="form-control form-control-sm" placeholder="Name" aria-label="Weapon Name">
					</td>
					<td colspan="1">
						<input type="text" name="trait_name" class="form-control form-control-sm" placeholder="Default" aria-label="Weapon Name">
					</td>
					<td colspan="2" class="two-stat">
						<input type="text" name="range_short" class="form-control form-control-sm" placeholder="S" aria-label="Range Short">
						<input type="text" name="range_long" class="form-control form-control-sm" placeholder="L" aria-label="Range Long">
					</td>
					<td colspan="2" class="two-stat">
						<input type="text" name="accuracy_short" class="form-control form-control-sm" placeholder="S" aria-label="Accuracy Short">
						<input type="text" name="accuracy_long" class="form-control form-control-sm" placeholder="L" aria-label="Accuracy Long">
					</td>
					<td colspan="1">
						<input type="text" name="strength" class="form-control form-control-sm" placeholder="Str" aria-label="Strength">
					</td>
					<td colspan="1">
						<input type="text" name="armor_penetration" class="form-control form-control-sm" placeholder="Ap" aria-label="Armor Penetration">
					</td>
					<td colspan="1">
						<input type="text" name="damage" class="form-control form-control-sm" placeholder="D" aria-label="Damage">
					</td>
					<td colspan="1">
						<input type="text" name="ammo_check" class="form-control form-control-sm" placeholder="Am" aria-label="Ammo Check">
					</td>
					<td colspan="3">
						<input type="text" name="traits" class="form-control form-control-sm" placeholder="Traits" aria-label="Traits">
					</td>
					<td colspan="1">
						<a class="button">+</a>
					</td>
				</tr>
				<tr>
					<td colspan="16" class="text-right">
						<a class="button add_weapon">Add Weapon</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</div>
