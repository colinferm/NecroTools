<thead class="dark">
	<tr>
		<th class="child-content"><div class="skill-name">{{skill_set_name}}</div></th>
		<th class="text-end pe-3" style="width: 50%">
			{{#if limited_to_gang}}<div class="skill-limit">Limited to {{gang_name}}</div>{{/if}}
			{{#if is_wyrd}}<div class="skill-limit">Wyrd Power</div>{{/if}}
		</th>
		<th style="width: 10%">
			<div class="btn-group" role="group">
				<button id="btnGroupDrop1" type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
				  Action
				</button>
				<ul class="dropdown-menu" aria-labelledby="btnGroupDrop1">
					<li class="d-flex flex-row align-items-start p-1 action_add"><i class="fi-plus me-2"></i> <span>Add Skill</span></li>
					<li class="d-flex flex-row align-items-start p-1 action_edit"><i class="fi-info me-2"></i> <span>Edit Set</span></li>
				</ul>
			</div>
		</th>
	</tr>
</thead>
