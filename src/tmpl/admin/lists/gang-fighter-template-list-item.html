<td class="type_name">{{type_name}}</td>
<td>
	{{#if house_gang}}
		<span class="yes">&#x2714;</span>
	{{else}} 
		<span class="no">&cross;</span>
	{{/if}}
</td>
<td>
	{{#if outlaw}}
		<span class="yes inverse">&#x2714;</span>
	{{else}} 
		<span class="no inverse">&cross;</span>
	{{/if}}
</td>
<td>{{last_mod}}</td>
<td class="flex-container align-center-middle">
	<ul class="dropdown menu" data-dropdown-menu data-disable-hover="true" data-click-open="true" data-close-on-click="true">
		<li>
			<a class="button hollow">Action</a>
			<ul class="menu icons icon-left">
				<li class="d-flex flex-row align-items-start p-1 action_edit"><i class="fi-info ms-1 me-2"></i> <span>Edit</span></li>
				<li class="d-flex flex-row align-items-start p-1 action_clone"><i class="fi-torsos ms-1 me-2"></i> <span>Clone</span></li>
				<li class="d-flex flex-row align-items-start p-1 action_remove"><i class="fi-trash ms-1 me-2"></i> <span>Delete</span></li>
			</ul>
		</li>
	</ul>
</td>
