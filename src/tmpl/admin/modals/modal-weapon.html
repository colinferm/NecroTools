<div class="continer-fluid">
	<div class="mb-3 form-floating">
		<input type="text" name="weapon_name" class="form-control" id="weaponName" placeholder="Name" aria-label="Weapon Name" value="{{model.weapon_name}}">
		<label for="weaponName" class="form-label">Name</label>
	</div>
	<div class="mb-3">
		{{{select-box field-name="weapon_category" collection-property="categories" item-id="id" item-name="category_name" model-property="category_id"}}}
	</div>
	<div class="mb-3 form-floating">
		<input type="number" name="weapon_value" class="form-control form-control-sm" id="weaponValue" placeholder="Value" aria-label="Weapon Value" value="{{model.weapon_value}}">
		<label for="weaponValue" class="form-label">Value</label>
	</div>
	<table class="table weapon-stats">
		<tbody>
			<tr class="flex-row ammo_type_row characteristic-id-0 d-none" data-id="0">
				<td class="form-floating flex-grow-1">
					<input type="text" name="ammo_type" class="form-control form-control-sm" id="ammoType" placeholder="Type" aria-label="Ammo Type">
					<label for="ammoType" class="form-label">Type</label>
				</td>
				<td class="form-floating">
					<input type="text" name="range_short" class="form-control form-control-sm small-stat" id="rangeShort" placeholder="S" aria-label="Short Range">
					<label for="rangeShort" class="form-label">S</label>
				</td>
				<td class="form-floating">
					<input type="text" name="range_long" class="form-control form-control-sm small-stat" id="rangeLong" placeholder="L" aria-label="Long Range">
					<label for="rangeLong" class="form-label">L</label>
				</td>
				<td class="form-floating">
					<input type="text" name="accuracy_short" class="form-control form-control-sm small-stat" id="accuracyShort" placeholder="S" aria-label="Accuracy Short">
					<label for="accuracyShort" class="form-label">S</label>
				</td>
				<td class="form-floating">
					<input type="text" name="accuracy_long" class="form-control form-control-sm small-stat" id="accuracyLong" placeholder="L" aria-label="Accuracy Long">
					<label for="accuracyLong" class="form-label">S</label>
				</td>
				<td class="form-floating">
					<input type="text" name="strength" class="form-control form-control-sm small-stat" id="statStrength" placeholder="S" aria-label="Strength">
					<label for="statStrength" class="form-label">S</label>
				</td>
				<td class="form-floating">
					<input type="text" name="armor_penetration" class="form-control form-control-sm small-stat" id="statArmorPenetration" placeholder="AP" aria-label="Armor Penetration">
					<label for="statArmorPenetration" class="form-label">AP</label>
				</td>
				<td class="form-floating">
					<input type="text" name="damage" class="form-control form-control-sm small-stat" id="statDamage" placeholder="D" aria-label="Damage">
					<label for="statDamage" class="form-label">D</label>
				</td>
				<td class="form-floating">
					<input type="text" name="ammo_check" class="form-control form-control-sm small-stat" id="ammoCheck" placeholder="Ammo" aria-label="Ammo">
					<label for="ammoCheck" class="form-label">Ammo</label>
				</td>
				<td class="flex-grow-1">
					<input type="text" name="traits" class="form-control form-control-sm" id="traits" placeholder="Traits" aria-label="Traits" data-characteristic-id="0">
				</td>
			</tr>
			{{#each model.characteristics.models as | characteristic |}}
				{{#with characteristic.attributes as | attr | }}
				<tr class="d-flex flex-row ammo_type_row characteristic-id-{{characteristic.id}}" data-id="{{characteristic.id}}">
					<td class="form-floating flex-grow-1">
						<input type="text" name="ammo_type" class="form-control form-control-sm" id="ammoType" placeholder="Type" aria-label="Ammo Type" value="{{attr.ammo_type}}">
						<label for="ammoType" class="form-label">Type</label>
					</td>
					<td class="form-floating">
						<input type="text" name="range_short" class="form-control form-control-sm small-stat" id="rangeShort" placeholder="S" aria-label="Short Range" value="{{attr.range_short}}">
						<label for="rangeShort" class="form-label">S</label>
					</td>
					<td class="form-floating">
						<input type="text" name="range_long" class="form-control form-control-sm small-stat" id="rangeLong" placeholder="L" aria-label="Long Range" value="{{attr.range_long}}">
						<label for="rangeLong" class="form-label">L</label>
					</td>
					<td class="form-floating">
						<input type="text" name="accuracy_short" class="form-control form-control-sm small-stat" id="accuracyShort" placeholder="S" aria-label="Accuracy Short" value="{{attr.accuracy_short}}">
						<label for="accuracyShort" class="form-label">S</label>
					</td>
					<td class="form-floating">
						<input type="text" name="accuracy_long" class="form-control form-control-sm small-stat" id="accuracyLong" placeholder="L" aria-label="Accuracy Long" value="{{attr.accuracy_long}}">
						<label for="accuracyLong" class="form-label">S</label>
					</td>
					<td class="form-floating">
						<input type="text" name="strength" class="form-control form-control-sm small-stat" id="statStrength" placeholder="S" aria-label="Strength" value="{{attr.strength}}">
						<label for="statStrength" class="form-label">S</label>
					</td>
					<td class="form-floating">
						<input type="text" name="armor_penetration" class="form-control form-control-sm small-stat" id="statArmorPenetration" placeholder="AP" aria-label="Armor Penetration" value="{{attr.armor_penetration}}">
						<label for="statArmorPenetration" class="form-label">AP</label>
					</td>
					<td class="form-floating">
						<input type="text" name="damage" class="form-control form-control-sm small-stat" id="statDamage" placeholder="D" aria-label="Damage" value="{{attr.damage}}">
						<label for="statDamage" class="form-label">D</label>
					</td>
					<td class="form-floating">
						<input type="text" name="ammo_check" class="form-control form-control-sm small-stat" id="ammoCheck" placeholder="Ammo" aria-label="Ammo" value="{{attr.ammo_check}}">
						<label for="ammoCheck" class="form-label">Ammo</label>
					</td>
					<td class="flex-grow-1">
						<input type="text" name="traits" class="form-control-sm" id="traits" placeholder="Traits" aria-label="Traits" data-characteristic-id="{{characteristic.id}}">
					</td>
				</tr>
				{{/with}}
			{{/each}}
			<tr class="add_ammo_row">
				<td colspan="9" class="text-left"><button class="btn add_ammo">Add Ammo Type</button></td>
			</tr>
		</tbody>
	</table>
</div>
