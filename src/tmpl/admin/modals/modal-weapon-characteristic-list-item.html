<td class="form-floating flex-grow-1">
	<input type="text" name="ammo_type" class="form-control form-control-sm" id="ammoType" placeholder="Type" aria-label="Ammo Type" value="{{ammo_type}}">
	<label for="ammoType" class="form-label">Type</label>
</td>
<td class="form-floating">
	<input type="text" name="range_short" class="form-control form-control-sm small-stat" id="rangeShort" placeholder="S" aria-label="Short Range" value="{{range_short}}">
	<label for="rangeShort" class="form-label">S</label>
</td>
<td class="form-floating">
	<input type="text" name="range_long" class="form-control form-control-sm small-stat" id="rangeLong" placeholder="L" aria-label="Long Range" value="{{range_long}}">
	<label for="rangeLong" class="form-label">L</label>
</td>
<td class="form-floating">
	<input type="text" name="accuracy_short" class="form-control form-control-sm small-stat" id="accuracyShort" placeholder="S" aria-label="Accuracy Short" value="{{accuracy_short}}">
	<label for="accuracyShort" class="form-label">S</label>
</td>
<td class="form-floating">
	<input type="text" name="accuracy_long" class="form-control form-control-sm small-stat" id="accuracyLong" placeholder="L" aria-label="Accuracy Long" value="{{accuracy_long}}">
	<label for="accuracyLong" class="form-label">L</label>
</td>
<td class="form-floating">
	<input type="text" name="strength" class="form-control form-control-sm small-stat" id="statStrength" placeholder="S" aria-label="Strength" value="{{strength}}">
	<label for="statStrength" class="form-label">S</label>
</td>
<td class="form-floating">
	<input type="text" name="armor_penetration" class="form-control form-control-sm small-stat" id="statArmorPenetration" placeholder="AP" aria-label="Armor Penetration" value="{{armor_penetration}}">
	<label for="statArmorPenetration" class="form-label">AP</label>
</td>
<td class="form-floating">
	<input type="text" name="damage" class="form-control form-control-sm small-stat" id="statDamage" placeholder="D" aria-label="Damage" value="{{damage}}">
	<label for="statDamage" class="form-label">D</label>
</td>
<td class="form-floating">
	<input type="text" name="ammo_check" class="form-control form-control-sm small-stat" id="ammoCheck" placeholder="Ammo" aria-label="Ammo" value="{{ammo_check}}">
	<label for="ammoCheck" class="form-label">Ammo</label>
</td>
<td class="flex-grow-1">
	<input type="text" name="traits" class="form-control-sm" id="traits" placeholder="Traits" aria-label="Traits" data-characteristic-id="{{id}}">
</td>
