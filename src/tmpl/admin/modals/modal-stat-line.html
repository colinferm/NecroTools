<div class="continer-fluid">
	<table class="table fighter-stats">
		<tbody>
			<tr>
				<td class="form-floating">
					<input type="text" name="movement" class="form-control form-control-sm" id="statMovement" placeholder="M" aria-label="Movement" value="{{model.movement}}">
					<label for="statMovement" class="form-label">M</label>
				</td>
				<td class="form-floating">
					<input type="text" name="weapon_skill" class="form-control form-control-sm" id="statWeaponSkill" placeholder="WS" aria-label="Weapon Skill" value="{{model.weapon_skill}}">
					<label for="statWeaponSkill" class="form-label">WS</label>
				</td>
				<td class="form-floating">
					<input type="text" name="balistic_skill" class="form-control form-control-sm" id="statBalisticSkill" placeholder="BS" aria-label="Ballistic Skill" value="{{model.balistic_skill}}">
					<label for="statBalisticSkill" class="form-label">BS</label>
				</td>
				<td class="form-floating">
					<input type="text" name="strength" class="form-control form-control-sm" id="statStrength" placeholder="S" aria-label="Strength" value="{{model.strength}}">
					<label for="statStrength" class="form-label">S</label>
				</td>
				<td class="form-floating">
					<input type="text" name="toughness" class="form-control form-control-sm" id="statToughness" placeholder="T" aria-label="Toughness" value="{{model.toughness}}">
					<label for="statToughness" class="form-label">T</label>
				</td>
				<td class="form-floating">
					<input type="text" name="wounds" class="form-control form-control-sm" id="statWounds" placeholder="W" aria-label="Wounds" value="{{model.wounds}}">
					<label for="statWounds" class="form-label">W</label>
				</td>
				<td class="form-floating">
					<input type="text" name="initiative" class="form-control form-control-sm" id="statInitiative" placeholder="I" aria-label="Inititive" value="{{model.initiative}}">
					<label for="statInitiative" class="form-label">I</label>
				</td>
				<td class="form-floating">
					<input type="text" name="attacks" class="form-control form-control-sm" id="statAttacks" placeholder="A" aria-label="Attacks" value="{{model.attacks}}">
					<label for="statAttacks" class="form-label">A</label>
				</td>
				<td class="form-floating head_stat">
					<input type="text" name="leadership" class="form-control form-control-sm" id="statLeadership" placeholder="LD" aria-label="Leadership" value="{{model.leadership}}">
					<label for="statLeadership" class="form-label">LD</label>
				</td>
				<td class="form-floating head_stat">
					<input type="text" name="cool" class="form-control form-control-sm" id="statCool" placeholder="CL" aria-label="Cool" value="{{model.cool}}">
					<label for="statCool" class="form-label">CL</label>
				</td>
				<td class="form-floating head_stat">
					<input type="text" name="willpower" class="form-control form-control-sm" id="statWillpower" placeholder="WIL" aria-label="Willpower" value="{{model.willpower}}">
					<label for="statWillpower" class="form-label">WIL</label>
				</td>
				<td class="form-floating head_stat">
					<input type="text" name="intelligence" class="form-control form-control-sm" id="statIntelligence" placeholder="INT" aria-label="Intelligence" value="{{model.intelligence}}">
					<label for="statIntelligence" class="form-label">INT</label>
				</td>
			</tr>
		</tbody>
	</table>
</div>
