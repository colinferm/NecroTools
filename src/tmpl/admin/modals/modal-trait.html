<div class="validation-alert alert alert-danger mb-3 d-none" role="alert">
  <i class="fi-alert"></i> There are invalid values in some fields.
</div>
<div class="form-floating mb-3">
	<input class="trait_name form-control" value="{{trait_name}}" id="traitName" type="text" placeholder="Trait Name">
	<label for="traitName">Trait Name</label>
</div>
<div class="form-floating mb-3">
	<input class="trait_value form-control" value="{{trait_value}}" id="traitValue" type="number" placeholder="Value" size="40">
	<label for="traitValue">Value</label>
</div>
<div class="form-floating mb-3">
	<textarea class="notes form-control" rows="6" id="notes" placeholder="Any special information about this trait.">{{notes}}</textarea>
	<label for="notes">Trait Notes</label>
</div>
