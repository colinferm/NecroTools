<div class="grid-x">
    {{#each skillsets}}
        <div class="skillset cell small-6">
            <h5>{{skill_set_name}}</h5>
            <ul>
            {{#each skills}}
                <li>{{#checkbox-skill name-param="skill_name" class-name="skill_box"}}{{/checkbox-skill}}</li>
            {{/each}}
            </ul>
        </div>
    {{/each}}
</div>
