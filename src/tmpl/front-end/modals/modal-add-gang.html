<div class="form-floating mb-3">
	{{{gang-select selected-id="gang_type_id" field-name="gang_type"}}}
	<label for="gangName">Gang Type</label>
</div>
<div class="form-floating mb-3">
	<input class="form-control gang_name" value="{{model.gang_name}}" id="gangName" type="text" placeholder="Gang Name" tabindex="1">
	<label for="gangName">Gang Name</label>
</div>
<div class="form-floating mb-3">
	<input class="form-control credits" value="{{model.credits}}" id="credits" type="text" placeholder="Credits" tabindex="1">
	<label for="credits">Credits</label>
</div>
<div class="form-check mb-3">
	{{{checkbox obj-name="model" class-name="isOutlaw" name-param="outlaw" id-param="outlaw"}}}
	<label class="form-check-label" for="outlaw">Outlaw?</label>
</div>
