<div>
    <p>Add an injury to <b>{{model.fighter_name}} ({{model.role_name}})</b>:</p>

    <select name="injury_type" class="injury_selector">
        <option value="0">- select -</option>
        {{#each injuries}}
            <option value="{{id}}">{{name}}</option>
        {{/each}}
    </select>

    <p class="injury_result"></p>
</div>
