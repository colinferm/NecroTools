<div class="gang-info-card p-4">
	<div class="gang-img"></div>
	<div class="gang-info d-flex">
		<div class="w-75">
			<h2>{{gang_name}}</h2>
			<h3>{{type_name}}</h3>
			<div class="info-extra">
				<div class="info-outlaw">
					Outlaw: 
					{{#if outlaw}}
						<span class="yes inverse">&#x2714;</span>
					{{else}} 
						<span class="no inverse">&cross;</span>
					{{/if}}
				</div>
				<div class="info-lastmod">
					{{last_mod}}
				</div>
			</div>
		</div>
		<div class="w-25 d-flex justify-content-end">
			<div>
				<div class="btn-group" role="group">
					<button id="btnGroupDrop1" type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
					&#9998;
					</button>
					<ul class="dropdown-menu" aria-labelledby="btnGroupDrop1">
						<li class="d-flex flex-row align-items-start p-1 action_edit"><i class="fi-info ms-1 me-2"></i> <span>Edit</span></li>
						<li class="d-flex flex-row align-items-start p-1 action_clone"><i class="fi-info ms-1 me-2"></i> <span>Clone</span></li>
						<li class="d-flex flex-row align-items-start p-1 action_remove"><i class="fi-trash ms-1 me-2"></i> <span>Delete</span></li>
					</ul>
				</div>
			</div>
		</div>
	</div>
</div>
