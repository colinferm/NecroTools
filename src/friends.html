<!doctype html>
<html class="no-js" lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="x-ua-compatible" content="ie=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		<link href="css/bootstrap-icons.min.css" rel="stylesheet" type="text/css" />
		<link href="css/foundation-icons.css" rel="stylesheet" type="text/css" />
		<link href="css/jquery-ui.theme.min.css" rel="stylesheet" type="text/css" />
		<link href="css/tagify.css" rel="stylesheet" type="text/css" />
		<script src="js/libs/jquery-3.7.1.min.js"></script>
		<title>Necro Tools</title>
	</head>
	<body>
		<section class="container d-flex">
			<div class="thread-list p-0 mt-2" style="min-width: 300px;">
				<p class="fs-5 fw-bold">Friends</p>
				<div class="card shadow border border-0">
					<ul class="list-group overflow-scroll" style="max-height: 800px;">
						<li class="list-group-item d-flex flex-row justify-content-between p-2 pt-3 pb-3">
							<div class="thread-img-container align-items-center me-2">
								<button type="button" class="btn btn-primary rounded-circle">CF</button>
							</div>
							<div class="thread-info-container flex-grow-1 d-flex flex-column">
								<div class="thread-top-info d-flex flex-row justify-content-between">
									<div class="fs-6"><strong>Dude's Name</strong></div>
									<div class="fs-6">Now</div>
								</div>
								<div class="thread-bottom-info d-flex flex-row justify-content-between">
									<span class="content text-secondary fs-6 d-inline-block text-truncate">This is some text info...</span>
								</div>
							</div>
						</li>
					</ul>
				</div>
			</div>
			<div class="friend-search container border-bottom ms-2 mt-2 d-flex flex-column">
				<div class="message-compose form-floating m-3 mt-6">
					<textarea class="form-control shadow" id="messageCompose" style="height: 100px;"></textarea>
					<label for="messageCompose" class="form-label">Message to...</label>
				</div>
				<div class="message-compose m-3 mt-0 text-end">
					<button type="button" class="btn btn-success">Send</button>
				</div>
			</div>
				
				
		
		</section>
		
		<script>
			$(document).ready(function(){
				var inbox = $('.list-group-item');
				
				for (var i = 0; i < 20; i++) {
					var c = inbox.clone();
					$('.list-group').append(c);
				}
			});
		</script>
		
		<script src="js/libs/moment.js"></script>
		<script src="js/libs/underscore-umd-1.13.7.min.js"></script>
		<script src="js/libs/handlebars.min-v4.7.8.js"></script>
		<script src="js/libs/backbone-1.6.0.min.js"></script>
		<script src="js/libs/bootstrap.bundle.min.js"></script>
		<script src="js/libs/jquery.cookie-1.3.js"></script>
		<script src="js/libs/jquery-ui.min.js"></script>
		<script src="js/libs/tagify.js"></script>
	</body>
</html>
